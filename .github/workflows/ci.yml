name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything else keys off this. A stylesheet change should not spend four
  # minutes rebuilding a JVM application it cannot possibly have affected.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      visual: ${{ steps.filter.outputs.visual }}
      api: ${{ steps.filter.outputs.api }}
      judge: ${{ steps.filter.outputs.judge }}
      contract: ${{ steps.filter.outputs.contract }}
      stack: ${{ steps.filter.outputs.stack }}
      infra: ${{ steps.filter.outputs.infra }}
      credentials: ${{ steps.filter.outputs.credentials }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            # Everything the rendered frontend is built out of. Named once
            # because two jobs are interested in it for different reasons.
            frontend: &frontend
              - 'apps/web/**'
              - 'packages/**'
              - 'mockups-and-design-system/design_system/**'
            web:
              - *shared
              - *frontend
              # Not because the web job tests the visual suite — it does not —
              # but because it owns the repository-wide `prettier --check`, and
              # a change confined to `visual/` must not slip past it.
              - 'visual/**'
            # The exact inverse of the `stack` negations below. Where the
            # end-to-end job deliberately ignores stylesheets and tokens because
            # it cannot see them, this one exists to look at them — a token
            # moving is precisely the change it has to run for.
            visual:
              - *shared
              - *frontend
              - 'visual/**'
            api:
              - *shared
              - 'apps/api/**'
            judge:
              - *shared
              - 'apps/judge/**'
            # The contract is generated from the backend and consumed by the
            # frontend, so either side moving can break it.
            contract:
              - *shared
              - 'apps/api/**'
              - 'packages/api-client/**'
              - 'scripts/*contract*.sh'
            # The end-to-end job builds and boots the whole stack, JVM included.
            # The negations are what make the acceptance criterion literally
            # true: a change confined to stylesheets or tokens matches nothing
            # here, so no image is rebuilt. Any change to actual application
            # code still runs it.
            stack:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'infra/**'
              - 'compose.*.yaml'
              - '!apps/web/src/styles/**'
              - '!packages/design-tokens/**'
              - '!mockups-and-design-system/**'
              # The cloud definitions are not part of the local stack. Only
              # `infra/caddy` is, and it is shared with production. The judge's
              # machine image is not either — it is built out of band, on an
              # instance, and nothing here can exercise it.
              - '!infra/terraform/**'
              - '!infra/judge-ami/**'
            infra:
              - *shared
              - 'infra/terraform/**'
              - 'infra/observability/**'
              - '.github/workflows/deploy.yml'
            # Deliberately not `*shared`: the detector has no dependencies and
            # no manifest, so a lockfile refresh cannot affect it and running
            # its fixtures for one would be noise.
            #
            # The example and compose files are here because the fixtures
            # assert on the committed ones directly — someone pasting a real
            # value into a `.example` file fails that assertion, and a filter
            # that did not list them would never run the job that says so.
            credentials:
              - '.github/workflows/ci.yml'
              - 'scripts/*credential_detector.py'
              # The installer and the hook, because the job below proves the
              # one actually installs the other. A detector nobody installs
              # guards nothing.
              - 'scripts/install-git-hooks.sh'
              - '.githooks/**'
              # `package.json` only for its `prepare` entry, which is what
              # causes the installer to run at all. Deleting that line breaks
              # the whole chain, and without this the job that says so would
              # not even be triggered by the commit that did it.
              - 'package.json'
              - '**/*.example'
              - 'compose.*.yaml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      # Scoped with an explicit filter, never `-r`. The end-to-end suite is a
      # workspace member too, and a recursive run would start Docker and build
      # the JVM image inside this job — the exact thing the path filtering
      # exists to avoid — while failing anyway, because no browser is installed
      # here.
      - run: pnpm --filter @gmc/web --filter "./packages/*" typecheck
      - run: pnpm --filter @gmc/web --filter "./packages/*" test
      - run: pnpm --filter @gmc/web build

  # Design fidelity, checked by comparing pixels against committed baselines.
  #
  # Runs inside the Playwright image rather than on the bare runner, and that is
  # not an optimisation: screenshots are platform-specific, and a baseline taken
  # anywhere other than where it is compared fails for reasons that have nothing
  # to do with the design. `visual/run-in-ci-image.sh` runs this same image
  # locally, so a baseline regenerated on a laptop is one this job agrees with
  # (ADR-0012).
  visual:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # Chromium shares memory between its processes through /dev/shm, which
      # Docker caps at 64MB. A full-viewport screenshot of a page with a canvas
      # behind it is exactly the workload that exhausts it, and the symptom is a
      # renderer that dies mid-test.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The baselines were taken with the browser build inside this image, and
      # the client driving it has to be the version that ships with it. A
      # lockfile refresh that moved Playwright forward would otherwise compare
      # against images rendered by a browser nobody is running any more, and the
      # failures would look like design drift.
      - name: The Playwright client and the image must agree
        # From `visual/`, because that is where the dependency is declared and
        # where Node can resolve it — the root holds no node_modules to speak of.
        working-directory: visual
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          echo "Installed @playwright/test: $installed"
          grep -q "playwright:v${installed}-noble" ../.github/workflows/ci.yml
          grep -q "playwright:v${installed}-noble" run-in-ci-image.sh
      - run: pnpm --filter @gmc/visual typecheck
      - run: pnpm --filter @gmc/visual test
      # Proves the suite can still fail. Runs after the comparison above, so a
      # genuine regression is reported as itself rather than as a confusing
      # "the canary passed when it should not have".
      - run: pnpm --filter @gmc/visual canary
      # The expected, actual and difference images, plus the HTML report that
      # puts them side by side. Without these a failure is a number of differing
      # pixels and nothing anyone can act on, which is how visual suites end up
      # blanket-approved.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diff
          path: |
            visual/test-results/
            visual/playwright-report/
          retention-days: 7

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon; nothing to install.
      - run: ./mvnw -B verify
        working-directory: apps/api

  judge:
    needs: changes
    if: needs.changes.outputs.judge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # go.mod, not go.sum: the judge has no third-party dependencies yet,
          # so no go.sum exists and pointing at one fails the setup step.
          cache-dependency-path: apps/judge/go.mod
      - run: go vet ./...
        working-directory: apps/judge
      # Warms the cache, so a slow registry shows up here as a slow pull rather
      # than as a mysteriously slow first test. The suite pulls the image itself
      # if it is missing, so this step is an optimisation, not a prerequisite.
      # The judge's tests drive real containers running real Python on purpose —
      # a stubbed runtime would prove only that the sandbox flags are spelled
      # correctly, and the flags holding is the entire product.
      - run: docker pull python:3.13-alpine
      # No -short. The container-backed tests fail rather than skip when Docker
      # is missing, so this job cannot go green by quietly testing nothing.
      - run: go test -race ./...
        working-directory: apps/judge
        timeout-minutes: 10

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates the OpenAPI document from the running backend and the typed
      # client from that document, then fails if either differs from what is
      # committed. Without this the two sides drift silently: both compile,
      # neither matches.
      - run: ./scripts/check-contract-drift.sh

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          # The wrapper rewrites stdout, which makes a failing `test` report
          # unreadable. Nothing here needs its outputs.
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      # No backend: this job never touches state and must never need
      # credentials to run on a pull request.
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      # The security and cost invariants, against a plan with mocked providers.
      # No AWS account, no credentials, no money — which is what lets them run
      # on every pull request rather than only when somebody remembers.
      - run: terraform test
        working-directory: infra/terraform

      # The stack that watches from outside the account (ADR-0008). Separate
      # state and separate credentials, so it is initialised and tested
      # separately too.
      - run: terraform init -backend=false
        working-directory: infra/terraform/observability
      - run: terraform validate
        working-directory: infra/terraform/observability
      - run: terraform test
        working-directory: infra/terraform/observability

      # The collector's configuration is delivered verbatim to the host by the
      # deploy, so a typo in it is a host with no telemetry — discovered during
      # the next incident rather than here. Alloy validates its own config, and
      # the container is the only way to run that.
      - name: Validate the collector configuration
        run: |
          docker run --rm \
            --volume "$PWD/infra/observability/alloy:/cfg:ro" \
            grafana/alloy:v1.18.0 validate /cfg/config.alloy

      # A dashboard that is not valid JSON fails at `apply`, which is a long
      # way from where it was written.
      - name: Check the dashboard parses
        run: |
          for dashboard in infra/observability/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$dashboard"
          done

  e2e:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gmc/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @gmc/e2e test
      - if: failure()
        run: docker compose -f compose.e2e.yaml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # The credential detector's fixtures, in both directions: known credential
  # shapes are refused, and realistic placeholders are not.
  #
  # It runs here rather than on request because the detector is about to become
  # load-bearing in three places — the commit guard, the repository sweep and
  # the Claude Code write guard — and a silent regression in it would disable
  # all three at once, with nothing failing to say so.
  credentials:
    needs: changes
    if: needs.changes.outputs.credentials == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not through pnpm, and that is the point rather than an oversight. The
      # detector's premise is that it needs no ecosystem toolchain — which is
      # what lets the commit hook cost milliseconds and work for a contributor
      # who only ever touches Go or Java. A job that installed one in order to
      # test it would quietly stop proving that.
      - run: python3 scripts/test_credential_detector.py --verbose
      # The other half of the guard. The fixtures prove the detector can tell a
      # credential from a placeholder; these build a throwaway repository, run
      # the real installer in it and make real commits, which is the half that
      # fails silently — git ignores a `core.hooksPath` pointing nowhere
      # without saying a word.
      - run: python3 scripts/test_commit_guard.py --verbose
      # What those tests cannot see from inside a repository they built
      # themselves: that anything in *this* one still runs the installer.
      # `prepare` is the only thing that does, and it is one deletable line.
      - name: The install lifecycle still runs the installer
        run: |
          python3 - <<'PY'
          import json, sys
          prepare = json.load(open("package.json"))["scripts"].get("prepare", "")
          if "install-git-hooks.sh" not in prepare:
              sys.exit(f"package.json `prepare` no longer installs the hooks: {prepare!r}")
          PY
      # `--local`, so a runner that happened to carry a global `core.hooksPath`
      # could not answer for the repository and make this pass vacuously.
      - name: The installer configures git in this checkout
        run: |
          git config --unset core.hooksPath || true
          ./scripts/install-git-hooks.sh
          test "$(git config --local --get core.hooksPath)" = ".githooks"

  # One status to require on the branch, so a skipped job does not read as a
  # missing check. `always()` is what lets this run when upstream jobs skip.
  ci:
    needs: [web, visual, api, judge, contract, infra, e2e, credentials]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything that ran did not pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not pass." >&2
              exit 1
            fi
          done
          echo "All jobs that ran passed."
