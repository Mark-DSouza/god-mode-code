name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything else keys off this. A stylesheet change should not spend four
  # minutes rebuilding a JVM application it cannot possibly have affected.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      judge: ${{ steps.filter.outputs.judge }}
      contract: ${{ steps.filter.outputs.contract }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            web:
              - *shared
              - 'apps/web/**'
              - 'packages/**'
              - 'mockups-and-design-system/design_system/**'
            api:
              - *shared
              - 'apps/api/**'
            judge:
              - *shared
              - 'apps/judge/**'
            # The contract is generated from the backend and consumed by the
            # frontend, so either side moving can break it.
            contract:
              - *shared
              - 'apps/api/**'
              - 'packages/api-client/**'
              - 'scripts/*contract*.sh'
            stack:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'infra/**'
              - 'compose.*.yaml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @gmc/web build

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon; nothing to install.
      - run: ./mvnw -B verify
        working-directory: apps/api

  judge:
    needs: changes
    if: needs.changes.outputs.judge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # go.mod, not go.sum: the judge has no third-party dependencies yet,
          # so no go.sum exists and pointing at one fails the setup step.
          cache-dependency-path: apps/judge/go.mod
      - run: go vet ./...
        working-directory: apps/judge
      - run: go test -race ./...
        working-directory: apps/judge

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates the OpenAPI document from the running backend and the typed
      # client from that document, then fails if either differs from what is
      # committed. Without this the two sides drift silently: both compile,
      # neither matches.
      - run: ./scripts/check-contract-drift.sh

  e2e:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gmc/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @gmc/e2e test
      - if: failure()
        run: docker compose -f compose.e2e.yaml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # One status to require on the branch, so a skipped job does not read as a
  # missing check. `always()` is what lets this run when upstream jobs skip.
  ci:
    needs: [web, api, judge, contract, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything that ran did not pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not pass." >&2
              exit 1
            fi
          done
          echo "All jobs that ran passed."
