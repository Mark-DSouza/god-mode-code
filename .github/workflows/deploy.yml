name: Deploy

# Pushing to the default branch is the deploy. There is no separate release
# step and nothing to click.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy in flight. Cancelling one halfway through leaves the
  # host in whatever state the script had reached, which is the one situation
  # where "cancel-in-progress" costs more than it saves.
  group: deploy-production
  cancel-in-progress: false

# Declared per job rather than here, so this is only the floor a job inherits
# when it says nothing: read-only, and never the OIDC token.
permissions:
  contents: read

# Every `uses:` below is pinned to a commit rather than a tag, and it matters
# more here than in CI: this is the workflow that can reach AWS. A tag is a
# pointer its owner can move, so `@v3` on any of the third-party actions in
# the build job is a standing invitation to run code nobody here has seen, in
# the one workflow where that code would be standing next to a credential. A
# commit cannot be moved. The trailing comment names the version the commit
# is; Dependabot rewrites the pin and the comment together
# (.github/dependabot.yml), so the label cannot drift from what it labels.

env:
  # These are derived from `var.environment` and `var.region` in
  # infra/terraform, and are repeated here because a workflow cannot read
  # Terraform state. Changing either variable means changing these too —
  # `terraform output` prints the values that must match.
  IMAGE_PREFIX: ghcr.io/mark-dsouza/god-mode-code
  DEPLOY_DOCUMENT: gmc-prod-deploy
  INSTANCE_NAME_TAG: gmc-prod-app
  AWS_REGION: ap-south-1

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Native arm64, because the instances are Graviton (ADR-0001). Building
    # under QEMU emulation instead would take the JVM image from about two
    # minutes to well over ten.
    runs-on: ubuntu-24.04-arm
    # Enough to check out the repository and push images to ghcr, and nothing
    # else. Three third-party `docker/*` actions run here, and none of them has
    # any business holding an OIDC token: one that did could exchange it for
    # the deploy role. ADR-0005 works through what a stolen IAM role costs —
    # hundreds of GPU instances inside ten minutes — for a different host, but
    # it is the same arithmetic arriving through a different door.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          # The web build context is the repository root: the app is a
          # workspace package and its token layer imports the design system
          # from outside its own directory.
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            # Error reporting is configured here rather than on the host,
            # because a bundle's configuration is fixed the moment it is built
            # (ADR-0002). Every one of these is optional: unset, the bundle
            # reports nothing and the build still succeeds, which is what keeps
            # a fork buildable.
            build_args: |
              VITE_SENTRY_DSN=${{ vars.SENTRY_DSN }}
              VITE_SENTRY_ENVIRONMENT=production
              VITE_COMMIT_SHA=${{ github.sha }}
              SENTRY_ORG=${{ vars.SENTRY_ORG }}
              SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          # Tagged with the commit SHA and nothing else that moves. The deploy
          # compares the requested reference against what is running to decide
          # whether the proxy needs replacing, and a mutable tag like `latest`
          # would make that comparison always look unchanged.
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          # The token that uploads source maps. Passed as a secret rather than
          # as a build argument, because a build argument is written into the
          # image's history for anyone who can pull it. Unset, the frontend
          # build skips the upload and ships no maps — stack traces stay
          # minified, but nothing fails.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # Skipped until the infrastructure has actually been applied and the role
    # it creates has been recorded as a repository variable. Without this, every
    # merge would fail on a missing role long before there is anything to
    # deploy to.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: production
    # The OIDC token exchanged for a short-lived AWS role, which is what
    # replaces a stored access key. No `contents`: this job drives the AWS CLI
    # and never checks the repository out, so a step added later that expects a
    # working tree fails saying so rather than quietly inheriting the ability
    # to read one.
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the application instance
        id: instance
        # By tag rather than by a stored id: changing the bootstrap script
        # replaces the instance, and a stored id would then point at something
        # that no longer exists.
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$INSTANCE_NAME_TAG" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"

          if [ -z "$instance_id" ] || [ "$(echo "$instance_id" | wc -w)" -ne 1 ]; then
            echo "Expected exactly one running application instance, found: '$instance_id'" >&2
            exit 1
          fi

          echo "id=$instance_id" >>"$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          set -euo pipefail

          command_id="$(aws ssm send-command \
            --document-name "$DEPLOY_DOCUMENT" \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --parameters \
              apiImage="$IMAGE_PREFIX/api:${{ github.sha }}",webImage="$IMAGE_PREFIX/web:${{ github.sha }}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "Systems Manager command: $command_id"

          # SendCommand returns before the invocation is queryable, and the
          # waiter treats InvocationDoesNotExist as a failure rather than as
          # "not yet" — so waiting immediately can fail a deploy that is
          # perfectly healthy. Poll until it exists first.
          for _ in $(seq 1 30); do
            if aws ssm get-command-invocation \
                 --command-id "$command_id" \
                 --instance-id "${{ steps.instance.outputs.id }}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # The waiter polls until the invocation leaves a pending state. It
          # exits non-zero on anything that is not Success, which is what makes
          # a failed deploy — including one that rolled itself back — a failed
          # workflow rather than a green tick over a broken site.
          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "${{ steps.instance.outputs.id }}"
          waiter_status=$?
          set -e

          # The script's own output is the useful part whether it passed or
          # failed, so it is always printed before the job's result is decided.
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query '{status: Status, stdout: StandardOutputContent, stderr: StandardErrorContent}' \
            --output text

          exit $waiter_status
