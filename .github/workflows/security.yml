name: Security

# Separate from `ci.yml`, for three reasons that are each sufficient on their
# own. A weekly schedule cannot express itself through `dorny/paths-filter`,
# which has no base ref to diff against on a scheduled run. A security finding
# arriving as "CI failed" conflates "the code works" with "the code is safe".
# And CodeQL needs `security-events: write`, which should not be handed to
# every job that builds a stylesheet.
#
# What gates a pull request here is code scanning's own reading of the diff,
# not this workflow's exit status (ADR-0013). The analysis jobs upload SARIF
# and exit successfully whatever they found; GitHub fingerprints the alerts,
# decides which of them the pull request introduced, and fails its own "Code
# scanning results" check. A scanner that exited non-zero on a pre-existing
# finding would be the whole-repository gate the ADR refuses.
#
# So two things want requiring on the branch: the `security` job below, which
# says the analysis ran and the dependency gate passed, and code scanning's
# check, which says the diff introduced nothing new.

on:
  # Not in the ticket, and load-bearing anyway: "new versus pre-existing" is
  # computed against the base branch's analysis, so without a run on `main`
  # there is nothing to be pre-existing and the first pull request to touch a
  # file inherits everything in it.
  push:
    branches: [main]
  pull_request:
  # Weekly, and the reason is the alert tier rather than the gate: a check
  # that only ever reads a diff never looks again at code nobody has touched
  # since it was written. This run analyses everything, populates the Security
  # tab, and fails nothing.
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  # Not plain `true`, which is what `ci.yml` can afford and this cannot. A
  # scheduled run's ref is `refs/heads/main`, indistinguishable from a push to
  # `main`, so `true` means any merge lands inside the weekly full analysis and
  # cancels it — silently, with nothing failing to say so and nothing retrying
  # until the following Monday. That is the alert tier ADR-0013 calls
  # deliberately fed, quietly starved. Superseding a pull request is still
  # worth doing; superseding the run that populates the Security tab is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every `uses:` below is pinned to a commit rather than a tag, for the reasons
# `ci.yml` sets out at length. Dependabot rewrites the pin and its `# vX.Y.Z`
# comment together (.github/dependabot.yml).

jobs:
  # The same argument as `ci.yml`'s filter job, and the same accepted price: a
  # duplicated job, because a workflow cannot read another workflow's outputs.
  # A stylesheet change has not affected the Go service and should not spend
  # minutes proving it.
  #
  # All three steps are skipped on a scheduled run, where there is no base ref
  # to diff against, and the outputs that anything reads on that event fall
  # back to "everything" — which is what the weekly run is for. `deps` is the
  # exception and says why below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A JSON array of the filters that matched, fed straight into the matrix
      # below, so the languages a change cannot have affected are never
      # analysed rather than being analysed and discarded.
      languages: ${{ steps.languages.outputs.changes || '["javascript-typescript","java-kotlin","go"]' }}
      # No `|| 'true'` fallback, unlike its sibling above. The only job that
      # reads this is gated on `pull_request`, which is the one event where
      # the step is not skipped, so a fallback would be unreachable.
      deps: ${{ steps.deps.outputs.deps }}
      terraform: ${{ steps.terraform.outputs.terraform || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: languages
        if: github.event_name != 'schedule'
        with:
          # Every key here is a CodeQL language identifier, not a name chosen
          # for readability, because `outputs.changes` becomes the matrix
          # verbatim. Which is also why this workflow's own path is repeated
          # three times instead of factored into a `shared:` anchor the way
          # `ci.yml` does it: an anchor needs a key to hang off, that key is a
          # filter like any other, and a change to this file put `shared` in
          # the matrix as a language. Measured, not reasoned about.
          filters: |
            # By extension rather than by directory: TypeScript lives in six
            # places already and the analysis follows the files, not the
            # layout. A directory list would go stale the first time a seventh
            # appeared, and it would go stale silently.
            javascript-typescript:
              - '.github/workflows/security.yml'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
            java-kotlin:
              - '.github/workflows/security.yml'
              - 'apps/api/**'
            go:
              - '.github/workflows/security.yml'
              - 'apps/judge/**'

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: deps
        if: github.event_name == 'pull_request'
        with:
          # A second step rather than a second filter in the one above, because
          # that one's `changes` output is the language matrix and anything
          # else matching would arrive there as a language CodeQL has never
          # heard of.
          filters: |
            deps:
              - '.github/workflows/security.yml'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'apps/api/pom.xml'
              - 'apps/judge/go.mod'
              - 'apps/judge/go.sum'

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: terraform
        if: github.event_name != 'schedule'
        with:
          # A third step for the same reason there is a second one: this output
          # is neither the language matrix nor the dependency gate.
          #
          # By extension rather than by directory, on the argument the language
          # filters make above and one of its own — the scan below reads every
          # `.tf` in the repository, so a filter naming `infra/terraform` would
          # be narrower than the thing it gates and would skip the job for a
          # change the job would have had something to say about.
          filters: |
            terraform:
              - '.github/workflows/security.yml'
              - '**/*.tf'

  # Named for what it does, not for what branch protection requires. The
  # required check is the `codeql` job below, and it is separate for a reason
  # this job's own name gives away: a matrix job's check runs are named
  # `codeql-analysis (java-kotlin)` and so on, one per leg, and there is no
  # check run under the bare job name at all.
  codeql-analysis:
    needs: changes
    # `fromJSON('[]')` is not an empty matrix, it is an error, so the case
    # where nothing matched has to be caught before the matrix is built.
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The reason this workflow is not in `ci.yml`. Scoped to the one job
      # that uploads SARIF.
      security-events: write
    strategy:
      # One language failing to analyse should not hide what the other two
      # found.
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only Go is built, so only Go needs a toolchain. The runner ships one,
      # but not necessarily the version `apps/judge/go.mod` asks for, and a
      # toolchain older than the module fails the build rather than the
      # analysis — which reads as CodeQL being broken.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: "1.26"
          # go.mod, not go.sum: the judge has no third-party dependencies yet,
          # so no go.sum exists and pointing at one fails the setup step.
          cache-dependency-path: apps/judge/go.mod

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # Java is analysed without building it, which is most of the saving
          # here — the alternative is a full Maven run, downloading the Spring
          # dependency tree to extract types CodeQL can read from source
          # instead. JavaScript has no build mode other than this one.
          #
          # Go does need its normal build: the extractor works off the
          # compiler, so `manual` and the step below rather than `autobuild`,
          # which would go looking for a `go.mod` that is not at the root.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}

      - if: matrix.language == 'go'
        run: go build ./...
        working-directory: apps/judge

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          # Keeps each language's results a separate set, so a run that
          # analysed only Go does not read as every JavaScript alert having
          # been fixed.
          category: /language:${{ matrix.language }}

  # The check `main` is protected by, and the only job here whose name is a
  # promise to something outside this file.
  #
  # <h2>Why the analysis cannot be the required check itself</h2>
  #
  # A required status check is matched by name, and a matrix job does not have
  # one. GitHub names a matrix leg's check run after the job *and its matrix
  # values*, so the analysis above reports `codeql-analysis (java-kotlin)`,
  # `codeql-analysis (javascript-typescript)`, and nothing under the job name.
  # The only time a bare job name is reported is when the job is skipped
  # entirely — which for the analysis means no language changed.
  #
  # Under its old name that inverted the gate. A pull request touching nothing
  # CodeQL reads skipped the job, reported `codeql` skipped, and satisfied the
  # requirement; a pull request touching two languages ran the analysis, never
  # reported a check called `codeql`, and left the requirement waiting for a
  # status that could no longer arrive. The protected branch was strictest
  # about the changes with the least code in them, and blocked outright on the
  # ones it was there to inspect.
  #
  # `if: always()` is what makes this a gate rather than a fourth leg of the
  # matrix: it runs whether the analysis passed, failed, was skipped, or was
  # cancelled, so the check is always reported and the answer is always the
  # analysis's own.
  codeql:
    needs: codeql-analysis
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Whether the analysis ran, not what it found. CodeQL uploads SARIF and
      # exits zero on findings by design — the check that fails a pull request
      # for an alert is code scanning's own, and it fires only on alerts the
      # diff introduced (docs/agents/security-controls.md).
      - name: Fail unless every language that was analysed passed
        run: |
          result="${{ needs.codeql-analysis.result }}"
          echo "codeql-analysis: $result"
          # `skipped` is a pass, and it is the one result that needs saying out
          # loud: it means no file CodeQL reads was touched, which the filter
          # in `changes` decided and this job is in no position to second-guess.
          # `cancelled` is not a pass — an analysis that was stopped concluded
          # nothing about the code.
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "CodeQL did not pass." >&2
            exit 1
          fi

  # ADR-0013's third scanning tier: misconfiguration in the infrastructure,
  # where CodeQL reads the code. Same contract as the jobs above — report,
  # upload, exit zero — and here that contract is the entire design rather than
  # a detail of it. The findings already here were triaged once, and every one
  # that survived is answered by a `#trivy:ignore:` comment on the resource it
  # concerns naming what bought it. A scanner exiting non-zero on those would
  # fail this job before code scanning was ever asked which findings the pull
  # request introduced, which is the whole-repository gate the ADR refuses.
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          # The repository root, not `infra/terraform`, and this is the
          # non-obvious part: Trivy writes SARIF paths relative to what it was
          # pointed at, so scanning the directory reports `alarms.tf` and code
          # scanning then attaches every alert to a file that does not exist at
          # that path. Measured, not reasoned about. Scope comes from the
          # scanner list below instead, which is a truer reading of "the
          # Terraform" anyway — it follows the files rather than the layout.
          scan-ref: .
          # Six of them in this workspace, none containing Terraform, all of
          # them slow to walk.
          skip-dirs: "**/node_modules"
          format: sarif
          output: trivy.sarif
          # Explicit, and load-bearing: see above.
          exit-code: "0"
          # Pinned to the version `scripts/security-sweep.sh` falls back to,
          # so a local sweep on a machine without Trivy installed reports what
          # this job reports. That is as far as the parity goes and the
          # overclaim is worth resisting: the sweep prefers whatever `trivy` is
          # on PATH, so a person with their own install is comparing against a
          # version nothing here pins. Move the two together anyway.
          version: v0.72.0
        env:
          # Terraform only — the Dockerfiles and compose files are application
          # surface and not this job's business. There is no action input for
          # it; Trivy takes every flag from a `TRIVY_`-prefixed variable.
          TRIVY_MISCONFIG_SCANNERS: terraform

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy.sarif
          # Its own set, for the reason the CodeQL categories exist: a run that
          # uploaded only Terraform results must not read as every CodeQL alert
          # having been fixed.
          category: /scanner:trivy

  # The one gate that does not go through SARIF: it reads the pull request's
  # dependency changes directly and fails when the diff *adds* a package with
  # a known vulnerability. It only functions on a pull request event, which is
  # why the scheduled run above has to exist.
  dependency-review:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      # No checkout. The action reads the pull request's dependency changes
      # from the API, and would want a working tree only to load a config file
      # this does not have.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Set here rather than left to the action's default, because the
          # number is a decision and a default is not. `low` is the strict end
          # of the scale, and this gate can afford it where a
          # whole-repository scan could not: it fires only on a package the
          # diff is adding, at the one moment when the cheap fix — a different
          # version, or a different package — is still on the table. Everything
          # it leaves alone (packages already here, CVEs published later) is
          # Dependabot's, per ADR-0013.
          fail-on-severity: low

  # One status to require on the branch, so a skipped job does not read as a
  # missing check — a filtered-out language would otherwise leave its check
  # pending forever, which is the sharp edge that makes naive path filtering
  # wedge pull requests. `always()` is what lets this run when upstream jobs
  # skip. Same shape as `ci.yml`'s aggregate; the name is fixed from here on.
  #
  # `changes` is in the list where `ci.yml` leaves its filter job out, because
  # a filter job that fails skips everything downstream, and everything
  # downstream skipping is how this job reports success.
  security:
    needs: [changes, codeql, terraform, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything that ran did not pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not pass." >&2
              exit 1
            fi
          done
          echo "All jobs that ran passed."
