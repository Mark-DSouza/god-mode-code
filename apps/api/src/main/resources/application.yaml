spring:
  application:
    name: god-mode-code-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/godmodecode}
    username: ${DATABASE_USER:godmodecode}
    password: ${DATABASE_PASSWORD:godmodecode}
    hikari:
      # The instance is memory-constrained and PostgreSQL connections are not
      # free. Ten is well above what a single 2GB box can usefully saturate.
      maximum-pool-size: 10
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Only one instance may migrate. Flyway takes a PostgreSQL session-level
    # advisory lock before touching the schema history table, so a second
    # instance starting at the same moment blocks here rather than racing —
    # which is what turns a rolling deploy from a coin flip into a queue.
    #
    # These retries are how long a losing instance waits for the winner to
    # finish: 50 attempts at one second each. A migration slower than that on
    # this dataset means something is wrong that a longer timeout would only
    # hide.
    lock-retry-count: 50
    # Refuse to start rather than silently repair a history that does not match
    # the migrations on disk. A checksum mismatch means the deployed artifact is
    # not the one the database was migrated by.
    validate-on-migrate: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  # In-flight requests finish before the JVM exits, so a deploy degrades the API
  # for a few seconds rather than returning errors to whoever was mid-request
  # (ADR-0009).
  shutdown: graceful

  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # Under `/actuator`, which Caddy does not proxy — it routes `/api/*` and
        # nothing else (ADR-0002). The collector reaches this over the container
        # network on the same host; the internet cannot reach it at all.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Stamped on every meter in this registry — including the judge's, which
      # are mirrored into it because the judge cannot ship its own (ADR-0005).
      # One Grafana stack holds every environment, so without these they land in
      # a single undifferentiated heap of series and nothing can tell a staging
      # spike from a production one.
      application: ${spring.application.name}
      environment: ${GMC_ENVIRONMENT:local}
      version: ${gmc.version}
    distribution:
      # Percentiles computed in the application and exported as a handful of
      # series, rather than histogram buckets exported as dozens per endpoint.
      # Buckets are the aggregatable option and would be the right answer behind
      # more than one instance; behind exactly one they would spend a large
      # slice of a 10,000 series allowance to produce the same two numbers
      # (ADR-0008).
      percentiles:
        http.server.requests: 0.95, 0.99

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    enabled: false

gmc:
  version: ${GMC_VERSION:0.0.1-SNAPSHOT}

  auth:
    # The Cognito user pool's issuer, e.g.
    # https://cognito-idp.<region>.amazonaws.com/<pool-id>. Blank until a pool
    # is provisioned, which SecurityConfig treats as "sign-in unavailable"
    # rather than failing to start (ADR-0011).
    issuer-uri: ${GMC_COGNITO_ISSUER_URI:}

  judge:
    # The judge's address on the private link. In production this is a fixed
    # private address that Terraform pins and the deploy script reads from
    # Parameter Store, so replacing the judge — which any change to its
    # bootstrap does — never requires redeploying the backend.
    #
    # The default is where `scripts/dev.sh` runs it locally.
    base-url: ${JUDGE_URL:http://localhost:9090}

    # One hop away inside the VPC, so a slow connect is a dead host.
    connect-timeout: 2s

    # The hard deadline on one judging, derived from the judge's own bounds
    # rather than picked: 30s waiting for a worker, 10s of wall clock, and a
    # moment to start the container. See JudgeConfiguration.
    timeout: 45s

    # Probing and scraping get their own, far shorter deadline. A monitor that
    # blocks for the judging deadline has stopped being a monitor.
    poll-timeout: 2s
    poll-interval: 15s

    # How long a successful probe stays believable. Past this the judge is
    # reported degraded, because a poller that has stopped running must not read
    # as good news.
    stale-after: 60s

  # Every cookie this backend sets — the Recognition Key and the CSRF token —
  # is Secure by default: the site is only ever reached over HTTPS through
  # Cloudflare (ADR-0002), and neither should travel in clear. Browsers treat
  # http://localhost as a secure context, so this stays on for local
  # development and for the containerised stack too — the override exists for
  # a plain-HTTP deployment, which nothing here is.
  cookie-secure: ${GMC_COOKIE_SECURE:true}

  # Enforced here rather than at Cloudflare, whose free tier allows only one
  # rule (ADR-0007). User creation is generous but keyed by source address
  # alone, since there is no User yet to key it by; Challenges and Runs are
  # keyed by both, so neither a shared address nor a script minting fresh
  # Users routes around the other.
  rate-limits:
    user-creation:
      limit: ${GMC_RATE_LIMIT_USER_CREATION:5}
      window: 1h
    challenge-issuing:
      limit: ${GMC_RATE_LIMIT_CHALLENGE_ISSUING:30}
      window: 1m
    run-submission:
      limit: ${GMC_RATE_LIMIT_RUN_SUBMISSION:30}
      window: 1m

  turnstile:
    # Cloudflare Turnstile's secret key, checked against a token the frontend
    # widget collects before Unclaimed User creation. Blank until a site is
    # provisioned, which UserService treats as "no challenge widget in this
    # environment" rather than failing to start — the same posture
    # SecurityConfig takes toward gmc.auth.issuer-uri.
    secret-key: ${GMC_TURNSTILE_SECRET_KEY:}

logging:
  # Empty by default, which leaves the human-readable console format in place
  # for local development. Production sets GMC_LOG_FORMAT=ecs, and from then on
  # every line is a JSON document the collector can ship and Loki can index by
  # field rather than by regular expression.
  structured:
    format:
      console: ${GMC_LOG_FORMAT:}
  # The correlation id, in the format a person reads. The structured formatter
  # picks it out of the diagnostic context by itself; this is what puts it in
  # front of anyone tailing a terminal.
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    dev.markdsouza.godmodecode: DEBUG
