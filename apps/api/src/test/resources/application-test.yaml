# Testcontainers supplies the datasource; nothing here should point at a
# developer's local database by accident.
spring:
  flyway:
    enabled: true

gmc:
  version: test

  judge:
    # No judge runs during the suite, and that is the point: these tests are
    # where "the judge being down degrades the Code Discipline and nothing else"
    # is actually exercised. Port 1 is reserved and refuses immediately, so the
    # probe fails fast instead of waiting out a connect timeout on a port
    # something else might happen to be listening on.
    base-url: http://127.0.0.1:1
    connect-timeout: 250ms
    poll-timeout: 250ms
    # One poll at startup and effectively none after it. The tests that care
    # about polling drive the monitor directly rather than waiting for a tick.
    poll-interval: 1h

management:
  metrics:
    tags:
      environment: test

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
