<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body>
<div id="root"></div>
<script type="text/babel">
const { Table, Avatar, RunChart } = window.GODMODECODEDesignSystem_ca0aa4;
const rows=[{rank:1,user:"neo_anderson",wpm:148,acc:99.2},{rank:2,user:"trinity",wpm:141,acc:98.7},{rank:3,user:"morpheus",wpm:133,acc:99.9},{rank:5,user:"you",wpm:112,acc:98.4}];
function Demo(){
  return (<>
    <div className="row">
      <Avatar initials="YU" size="lg" />
      <Avatar initials="NE" />
      <Avatar initials="TR" size="sm" glow={false} />
    </div>
    <Table
      columns={[
        {key:"rank",label:"#",width:"48px",align:"center"},
        {key:"user",label:"User"},
        {key:"wpm",label:"WPM",width:"90px",align:"right"},
        {key:"acc",label:"Acc",width:"80px",align:"right",muted:true,render:v=>v+"%"},
      ]}
      rows={rows}
      getRowKey={r=>r.rank}
      getHighlight={r=>r.user==="you"} />
    <RunChart values={[96,104,88,118,110,126,121,133,119,140,131,148,129,136]} label="Last 14 runs · WPM" peakLabel="peak 148" />
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
