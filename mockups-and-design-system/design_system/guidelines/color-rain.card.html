<!-- @dsCard group="Colors" viewport="700x150" name="Rain Scale" subtitle="Phosphor green from shine-head to faint-tail" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;background:var(--void);padding:20px;display:flex;gap:0}.sw{flex:1;height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px}.sw b{color:#000;font-weight:700}.sw span{opacity:.85}</style></head>
<body>
<div class="sw" style="background:var(--rain-shine)"><b>shine</b></div>
<div class="sw" style="background:var(--rain-glow)"><b>glow</b></div>
<div class="sw" style="background:var(--rain-bright)"><b>bright</b></div>
<div class="sw" style="background:var(--rain-green)"><b>green</b></div>
<div class="sw" style="background:var(--rain-mid)"><b>mid</b></div>
<div class="sw" style="background:var(--rain-dim);color:var(--rain-shine)"><b style="color:var(--rain-shine)">dim</b></div>
<div class="sw" style="background:var(--rain-dark);color:var(--rain-green)"><b style="color:var(--rain-green)">dark</b></div>
<div class="sw" style="background:var(--rain-faint);color:var(--rain-mid)"><b style="color:var(--rain-mid)">faint</b></div>
</body></html>
