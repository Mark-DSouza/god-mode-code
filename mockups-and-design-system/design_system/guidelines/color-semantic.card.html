<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & Ink" subtitle="Correct, error, warning, info + text inks" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;background:var(--void);padding:20px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:0}.sw{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;font-weight:700}.ink{flex:1;font-family:var(--font-mono);font-size:13px;padding:4px 0}</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--correct);color:#000">correct</div>
<div class="sw" style="background:var(--error);color:#fff">error</div>
<div class="sw" style="background:var(--warning);color:#000">warning</div>
<div class="sw" style="background:var(--info);color:#000">info</div>
</div>
<div class="row" style="gap:20px">
<div class="ink" style="color:var(--ink-max)">ink-max — headings</div>
<div class="ink" style="color:var(--ink-1)">ink-1 — body</div>
<div class="ink" style="color:var(--ink-2)">ink-2 — muted</div>
<div class="ink" style="color:var(--ink-3)">ink-3 — disabled</div>
</div>
</body></html>
