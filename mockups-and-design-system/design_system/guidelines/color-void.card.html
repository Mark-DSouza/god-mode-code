<!-- @dsCard group="Colors" viewport="700x150" name="Void Neutrals" subtitle="Black surfaces, green-tinted as they lift" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;background:var(--carbon);padding:20px;display:flex;gap:0}.sw{flex:1;height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;color:var(--ink-1);border-right:1px solid var(--line-faint)}.sw b{color:var(--ink-max)}.sw span{color:var(--ink-3)}</style></head>
<body>
<div class="sw" style="background:var(--void)"><b>void</b><span>#000000</span></div>
<div class="sw" style="background:var(--carbon)"><b>carbon</b><span>#030503</span></div>
<div class="sw" style="background:var(--surface-1)"><b>surface-1</b><span>#070B07</span></div>
<div class="sw" style="background:var(--surface-2)"><b>surface-2</b><span>#0B110B</span></div>
<div class="sw" style="background:var(--surface-3)"><b>surface-3</b><span>#10190F</span></div>
<div class="sw" style="background:var(--line)"><b>line</b><span>#13331A</span></div>
<div class="sw" style="background:var(--line-bright)"><b>line-bright</b><span>#1C5A2E</span></div>
</body></html>
