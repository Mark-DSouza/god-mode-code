<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;background:var(--void);padding:22px;display:flex;align-items:center;gap:36px;height:116px;font-family:var(--font-terminal);font-size:26px;color:var(--rain-green)}.l{font-family:var(--font-mono);font-size:10px;color:var(--ink-2);letter-spacing:.1em;margin-top:8px;text-align:center}.c{display:flex;flex-direction:column;align-items:center}</style></head>
<body>
<div class="c"><span style="text-shadow:var(--glow-sm)">GLOW</span><span class="l">glow-sm</span></div>
<div class="c"><span style="text-shadow:var(--glow-md)">GLOW</span><span class="l">glow-md</span></div>
<div class="c"><span style="text-shadow:var(--glow-lg)">GLOW</span><span class="l">glow-lg</span></div>
<div class="c"><span style="color:var(--rain-shine);text-shadow:var(--glow-shine)">SHINE</span><span class="l">glow-shine</span></div>
<div class="c"><span style="color:var(--error);text-shadow:var(--glow-error)">ERR</span><span class="l">glow-error</span></div>
</body></html>
