<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;background:var(--void);padding:22px;display:flex;gap:18px;height:126px;align-items:stretch}.p{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px;font-family:var(--font-mono);font-size:11px;color:var(--ink-2);position:relative;overflow:hidden}.t{font-family:var(--font-terminal);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-max);margin-bottom:6px}</style></head>
<body>
<div class="p"><div class="t">Base panel</div>hairline border<br/>radius-md · 4px</div>
<div class="p" style="box-shadow:var(--box-glow)"><div class="t" style="color:var(--rain-green)">Glow panel</div>green edge bloom<br/>focus / active</div>
<div class="p"><div class="t">Scanlines</div>CRT overlay<div style="position:absolute;inset:0;background-image:var(--scanlines);opacity:.6"></div></div>
</body></html>
