<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;background:var(--void);padding:22px;display:flex;align-items:baseline;gap:40px;height:116px}.n{font-family:var(--font-crt);color:var(--rain-green);text-shadow:var(--glow-md);line-height:.8}.l{font-family:var(--font-terminal);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}</style></head>
<body>
<div><div class="n" style="font-size:82px">112</div><div class="l">wpm</div></div>
<div><div class="n" style="font-size:82px;color:var(--warning);text-shadow:0 0 12px color-mix(in srgb,var(--warning) 55%,transparent)">98.4</div><div class="l">accuracy %</div></div>
<div><div class="n" style="font-size:82px;color:var(--rain-shine)">00:21</div><div class="l">time</div></div>
</body></html>
