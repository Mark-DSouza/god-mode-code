<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="GOD_MODE_CODE Website" description="Matrix speed-typing site: pick a discipline and start a run over live digital rain." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>@keyframes gmc-caret{0%,49%{opacity:1}50%,100%{opacity:0}}</style>
</helmet>
<div style="position:relative;min-height:100vh;background:#000;overflow:hidden;font-family:var(--font-mono)">
  <x-import component-from-global-scope="GODMODECODEDesignSystem_ca0aa4.DigitalRain" intensity="{{ rainIntensity }}" speed="{{ rainSpeed }}" hint-size="100%,100%" style="position:fixed;inset:0;z-index:0;opacity:0.55"></x-import>
  <div style="position:relative;z-index:10;min-height:100vh">
    <header style="display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb, #000 72%, transparent);backdrop-filter:blur(4px)">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:var(--font-crt);font-size:32px;color:var(--rain-green);text-shadow:var(--glow-md);line-height:0.7">▚</span>
        <span style="font-family:var(--font-terminal);font-size:22px;letter-spacing:0.16em;color:var(--rain-shine);text-shadow:var(--glow-sm)">GOD_MODE_CODE</span>
      </div>
      <nav style="display:flex;align-items:center;gap:4px">
        <span style="font-family:var(--font-terminal);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--rain-green);text-shadow:var(--glow-sm);padding:8px 14px">Practice</span>
        <span style="font-family:var(--font-terminal);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2);padding:8px 14px">Leaderboard</span>
        <span style="font-family:var(--font-terminal);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2);padding:8px 14px">Settings</span>
      </nav>
    </header>

    <sc-if value="{{ running }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:900px;margin:0 auto;padding:40px 28px">
        <div style="display:flex;gap:40px;margin-bottom:26px">
          <x-import component-from-global-scope="GODMODECODEDesignSystem_ca0aa4.Stat" value="{{ wpm }}" unit="wpm" label="Speed" size="sm" align="left" hint-size="120px,80px"></x-import>
          <x-import component-from-global-scope="GODMODECODEDesignSystem_ca0aa4.Stat" value="{{ pct }}" unit="%" label="Done" size="sm" align="left" accent="white" hint-size="120px,80px"></x-import>
        </div>
        <x-import component-from-global-scope="GODMODECODEDesignSystem_ca0aa4.Card" scanlines="{{ true }}" padding="var(--space-6)" hint-size="100%,200px">
          <x-import component-from-global-scope="GODMODECODEDesignSystem_ca0aa4.TypingField" text="{{ text }}" typed="{{ typed }}" hint-size="100%,120px"></x-import>
        </x-import>
        <div style="text-align:center;margin-top:22px;font-size:12px;color:var(--ink-3)">type the passage · Esc to reset</div>
      </div>
    </sc-if>

    <sc-if value="{{ notRunning }}" hint-placeholder-val="{{ true }}">
      <div style="max-width:980px;margin:0 auto;padding:56px 28px 40px">
        <div style="text-align:center;margin-bottom:44px">
          <h1 style="font-family:var(--font-terminal);font-size:60px;letter-spacing:0.06em;color:var(--ink-max);text-shadow:var(--glow-md);margin-bottom:14px">HOW FAST CAN YOU TYPE?</h1>
          <p style="font-size:16px;color:var(--ink-2);max-width:560px;margin:0 auto;line-height:1.35">Pick a discipline. The rain falls while you type. Beat your best WPM.</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:34px">
          <sc-for list="{{ challenges }}" as="c" hint-placeholder-count="3">
            <x-import component-from-global-scope="GODMODECODEDesignSystem_ca0aa4.ChallengeCard" glyph="{{ c.glyph }}" title="{{ c.title }}" description="{{ c.description }}" meta="{{ c.meta }}" selected="{{ c.selected }}" onClick="{{ c.pick }}" hint-size="100%,168px"></x-import>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
          <x-import component-from-global-scope="GODMODECODEDesignSystem_ca0aa4.Button" size="lg" onClick="{{ startRun }}" hint-size="160px,52px">Start Run</x-import>
          <span style="font-size:12px;color:var(--ink-3)">selected: {{ selectedTitle }}</span>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { selected: "code", running: false, typed: "" };

  data() {
    return {
      quotes: { glyph: "❝❞", title: "Quotes", meta: "240 passages", description: "Motivational one-liners to warm up your fingers.", text: "Do or do not. There is no try." },
      code: { glyph: "{ }", title: "Code", meta: "88 blocks", description: "Short blocks pulled from real open-source repos.", text: "const sum = arr.reduce((a, b) => a + b, 0);" },
      prose: { glyph: "¶", title: "Prose", meta: "60 passages", description: "Profound paragraphs from the canon of literature.", text: "It was the best of times, it was the worst of times." },
    };
  }

  componentDidMount() { this._tick(); }
  _tick() {
    // Demo auto-typer so the running state animates in the preview.
    if (this.state.running) {
      const full = this.data()[this.state.selected].text;
      if (this.state.typed.length < full.length) {
        this.setState({ typed: full.slice(0, this.state.typed.length + 1) });
      }
    }
    if (window.lucide) window.lucide.createIcons();
    this._t = setTimeout(() => this._tick(), 90);
  }
  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    const d = this.data();
    const sel = this.state.selected;
    const full = d[sel].text;
    const pct = this.state.running ? Math.round((this.state.typed.length / full.length) * 100) : 0;
    const wpm = this.state.running ? Math.min(148, 40 + this.state.typed.length * 3) : 0;
    return {
      running: this.state.running,
      notRunning: !this.state.running,
      rainIntensity: this.state.running ? 0.85 : 0.5,
      rainSpeed: this.state.running ? 1.6 : 1,
      text: full,
      typed: this.state.typed,
      pct, wpm,
      selectedTitle: d[sel].title,
      startRun: () => this.setState({ running: true, typed: "" }),
      challenges: ["quotes", "code", "prose"].map((k) => ({
        ...d[k], selected: k === sel, pick: () => this.setState({ selected: k }),
      })),
    };
  }
}
</script>
</body>
</html>
