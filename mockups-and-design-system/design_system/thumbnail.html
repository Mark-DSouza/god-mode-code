<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./styles.css" />
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;background:var(--void);overflow:hidden}
  .main{flex:1;display:grid;place-items:center;background:var(--void);position:relative}
  .main .name{font-family:var(--font-terminal);font-size:96px;letter-spacing:0.06em;color:var(--rain-green);text-shadow:0 0 24px color-mix(in srgb,var(--rain-green) 70%,transparent),0 0 60px color-mix(in srgb,var(--rain-green) 40%,transparent);white-space:nowrap}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip>div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><span class="name">GOD_MODE_CODE</span></div>
  <div class="strip">
    <div style="background:var(--rain-shine)"></div>
    <div style="background:var(--rain-bright)"></div>
    <div style="background:var(--rain-green)"></div>
    <div style="background:var(--rain-dark)"></div>
  </div>
</div>
</body>
</html>
